<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Organizador de Tarefas</title>
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin:0; padding:0; background:#E9E1CC; }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #E9E1CC;
    --paper-dark: #DCD2B6;
    --ink: #20261F;
    --ink-soft: #4a5246;
    --line: #b9ad8d;
    --mestrado: #2B4C7E;
    --mestrado-bg: #DEE6EF;
    --movimento1: #7A1F1F;
    --movimento1-bg: #E8D6D6;
    --movimento2: #A32B2B;
    --movimento2-bg: #F0DCDA;
    --partido: #C0524B;
    --partido-bg: #F3E0DE;
    --pessoal: #8A6B3D;
    --pessoal-bg: #EAE0CB;
    --outros: #5C5C5C;
    --outros-bg: #DDDDDD;
    --stamp: #A32B2B;
    --paper-white: #F5F0E1;
  }
  *{box-sizing:border-box;}
  #app{
    font-family:'Source Serif 4', serif;
    color:var(--ink);
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    min-height:100%;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  .header{
    padding:28px 24px 18px;
    border-bottom:3px double var(--ink);
  }
  .header h1{
    font-family:'Archivo Black', sans-serif;
    font-size:26px;
    letter-spacing:-0.5px;
    margin:0 0 4px;
    text-transform:uppercase;
  }
  .header .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--paper-dark);
  }
  .toolbar button.filter-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--paper-white);
    border:1px solid var(--ink);
    color:var(--ink);
    padding:6px 10px;
    cursor:pointer;
    border-radius:2px;
  }
  .toolbar button.filter-btn.active{
    background:var(--ink);
    color:var(--paper-white);
  }
  .add-btn{
    margin-left:auto;
    font-family:'Archivo Black', sans-serif;
    font-size:12px;
    background:var(--stamp);
    color:var(--paper-white);
    border:none;
    padding:10px 16px;
    cursor:pointer;
    border-radius:2px;
    letter-spacing:0.5px;
  }
  .add-btn:hover{ filter:brightness(1.08); }

  .board{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:0;
  }
  @media (max-width:1500px){
    .board{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width:900px){
    .board{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:600px){
    .board{ grid-template-columns:1fr; }
  }
  .column{
    border-right:1px solid var(--line);
    min-height:200px;
  }
  .column:last-child{ border-right:none; }
  .column-head{
    padding:16px 18px 10px;
    position:sticky;
    top:0;
  }
  .column-head h2{
    font-family:'Archivo Black', sans-serif;
    font-size:14px;
    text-transform:uppercase;
    margin:0 0 2px;
    letter-spacing:0.3px;
  }
  .column-head .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
  }
  .col-mestrado .column-head{ border-bottom:3px solid var(--mestrado); }
  .col-movimento1 .column-head{ border-bottom:3px solid var(--movimento1); }
  .col-movimento2 .column-head{ border-bottom:3px solid var(--movimento2); }
  .col-partido .column-head{ border-bottom:3px solid var(--partido); }
  .col-pessoal .column-head{ border-bottom:3px solid var(--pessoal); }
  .col-outros .column-head{ border-bottom:3px solid var(--outros); }

  .cards{ padding:12px 14px; display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--paper-white);
    border:1px solid var(--line);
    border-left-width:4px;
    padding:12px 12px 10px;
    position:relative;
    box-shadow:1px 2px 0 rgba(0,0,0,0.05);
  }
  .col-mestrado .card{ border-left-color:var(--mestrado); }
  .col-movimento1 .card{ border-left-color:var(--movimento1); }
  .col-movimento2 .card{ border-left-color:var(--movimento2); }
  .col-partido .card{ border-left-color:var(--partido); }
  .col-pessoal .card{ border-left-color:var(--pessoal); }
  .col-outros .card{ border-left-color:var(--outros); }
  .card.done{ opacity:0.55; }
  .card.done .card-title{ text-decoration:line-through; }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-title{ font-size:14.5px; font-weight:600; line-height:1.3; margin:0 0 4px; cursor:pointer; }
  .card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .card-meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    padding:2px 6px;
    border-radius:2px;
    border:1px solid var(--ink-soft);
  }
  .tag.tipo-recorrente{ background:var(--mestrado-bg); }
  .tag.tipo-prazo{ background:var(--partido-bg); }
  .tag.tipo-pontual{ background:var(--movimento1-bg); }
  .tag.prio-alta{ border-color:var(--stamp); color:var(--stamp); font-weight:600; }
  .due{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-soft); }

  .card-actions{ display:flex; gap:6px; margin-top:8px; }
  .card-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    background:none;
    border:1px solid var(--line);
    padding:3px 7px;
    cursor:pointer;
    border-radius:2px;
    color:var(--ink-soft);
  }
  .card-actions button:hover{ border-color:var(--ink); color:var(--ink); }

  .stamp-mark{
    position:absolute;
    top:8px;
    right:8px;
    font-family:'Archivo Black', sans-serif;
    font-size:8.5px;
    letter-spacing:0.5px;
    color:var(--stamp);
    border:1.5px solid var(--stamp);
    padding:2px 5px;
    transform:rotate(6deg);
    border-radius:3px;
    opacity:0.85;
    text-transform:uppercase;
  }

  .empty{
    padding:24px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(32,38,31,0.55);
    display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper-white);
    border:2px solid var(--ink);
    max-width:440px; width:100%;
    padding:22px;
    max-height:90vh;
    overflow-y:auto;
  }
  .modal h3{
    font-family:'Archivo Black', sans-serif;
    font-size:15px; text-transform:uppercase; margin:0 0 14px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-soft); margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size:14px;
    padding:7px 8px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:2px;
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:50px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .modal-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; text-transform:uppercase;
    padding:8px 14px; border-radius:2px; cursor:pointer;
  }
  .btn-cancel{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-save{ background:var(--ink); border:1px solid var(--ink); color:var(--paper-white); }
  .btn-delete{ background:none; border:1px solid var(--stamp); color:var(--stamp); margin-right:auto; }

  .view-toggle{
    display:flex; gap:6px; margin-left:8px;
  }
  .deadline-list{ padding:16px 20px; display:flex; flex-direction:column; gap:8px; max-width:820px; }
  .deadline-row{
    background:var(--paper-white);
    border:1px solid var(--line);
    border-left-width:4px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .deadline-row.done{ opacity:0.5; }
  .deadline-row.done .dl-title{ text-decoration:line-through; }
  .deadline-row.overdue{ border-left-color:var(--stamp) !important; background:var(--partido-bg); }
  .dl-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    min-width:78px;
    color:var(--ink);
  }
  .dl-date.none{ color:var(--ink-soft); font-weight:400; }
  .dl-area-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; text-transform:uppercase; letter-spacing:0.3px;
    padding:2px 6px; border-radius:2px; border:1px solid var(--ink-soft);
    white-space:nowrap;
  }
  .dl-title{ font-size:14px; flex:1; cursor:pointer; }
  .dl-sub{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-soft); white-space:nowrap; }

  @media print{
    .toolbar{ display:none !important; }
    .overlay{ display:none !important; }
    #app{ background:#fff !important; }
    .header{ border-bottom:2px solid #000; }
    .board{ display:block !important; }
    .column{
      border:none !important;
      break-inside:avoid;
      page-break-inside:avoid;
      margin-bottom:14px;
    }
    .column-head{ border-bottom:2px solid #000 !important; }
    .cards{ display:block; padding:8px 0; }
    .card{
      box-shadow:none !important;
      border:1px solid #999 !important;
      border-left-width:4px !important;
      break-inside:avoid;
      page-break-inside:avoid;
      margin-bottom:6px;
    }
    .stamp-mark{ color:#000 !important; border-color:#000 !important; }
    .deadline-list{ max-width:none; }
    .deadline-row{ break-inside:avoid; box-shadow:none !important; }
  }
</style>

<div id="app"><div class="loading">Carregando tarefas…</div></div>

<script>
const AREAS = {
  mestrado: {
    label: 'Mestrado',
    subs: [
      'Trabalho de campo / sistematização',
      'Elaboração de relatórios',
      'Leituras p/ pesquisa + fichamento',
      'Projeto de pesquisa / qualificação',
      'Leituras de disciplinas',
      'Atividades avaliativas',
      'Leituras grupo de pesquisa',
      'Leituras grupo de orientandos',
      'Reunião com orientador',
      'Congressos / seminários',
      'Prazos de publicação',
      'Outro'
    ]
  },
  movimento1: {
    label: 'Movimento Social 1 (VJL)',
    subs: [
      'Documentos de planejamento',
      'Reunião do Fórum de coordenações',
      'Coordenação de Associação',
      'Coordenação de Relações Políticas',
      'Atividade externa (representando)',
      'Atividade externa (participando)',
      'Recrutamento',
      'Outro'
    ]
  },
  movimento2: {
    label: 'Movimento Social 2 (VAT)',
    subs: [
      'Reuniões',
      'Plenárias',
      'Materiais',
      'Entidades',
      'Instituições',
      'Audiências',
      'Pressão',
      'Redes',
      'Outro'
    ]
  },
  partido: {
    label: 'Partido',
    subs: [
      'Reunião do núcleo territorial',
      'Plenária / evento amplo',
      'Campanha eleitoral',
      'Tarefa de apoio à campanha',
      'Leitura de documentos políticos',
      'Reunião sobre movimento de trabalhadores',
      'Outro'
    ]
  },
  pessoal: {
    label: 'Vida Pessoal',
    subs: [
      'Saúde e bem-estar',
      'Descanso / lazer',
      'Família',
      'Finanças pessoais',
      'Tarefas domésticas',
      'Relacionamentos',
      'Outro'
    ]
  },
  outros: {
    label: 'Outros',
    subs: [
      'Outro'
    ]
  }
};

let tasks = [];
let filterStatus = 'todas';
let viewMode = 'board'; // 'board' or 'prazo'
let editingId = null;

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

const STORAGE_KEY = 'organizador-tarefas-v1';
const hasClaudeStorage = typeof window.storage !== 'undefined';

async function loadTasks(){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get('tasks', false);
      tasks = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }
  }catch(e){
    tasks = [];
  }
  render();
}

async function saveTasks(){
  try{
    if(hasClaudeStorage){
      await window.storage.set('tasks', JSON.stringify(tasks), false);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }
  }catch(e){
    console.error('erro ao salvar', e);
  }
}

function openModal(id){
  editingId = id || null;
  const t = id ? tasks.find(x=>x.id===id) : null;
  const app = document.getElementById('app');
  const overlay = document.createElement('div');
  overlay.className = 'overlay open';
  overlay.id = 'overlay';

  const areaOptions = Object.keys(AREAS).map(k=>`<option value="${k}" ${t&&t.area===k?'selected':''}>${AREAS[k].label}</option>`).join('');

  overlay.innerHTML = `
    <div class="modal">
      <h3>${t? 'Editar tarefa':'Nova tarefa'}</h3>
      <div class="field">
        <label>Título</label>
        <input id="f-title" value="${t? escapeHtml(t.title): ''}" placeholder="Ex: Ler capítulo 3 do fichamento X" />
      </div>
      <div class="row2">
        <div class="field">
          <label>Área</label>
          <select id="f-area">${areaOptions}</select>
        </div>
        <div class="field">
          <label>Subcategoria</label>
          <select id="f-sub"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Tipo</label>
          <select id="f-tipo">
            <option value="recorrente" ${t&&t.tipo==='recorrente'?'selected':''}>Recorrente / semanal</option>
            <option value="prazo" ${t&&t.tipo==='prazo'?'selected':''}>Com prazo</option>
            <option value="pontual" ${!t||t.tipo==='pontual'?'selected':''}>Pontual</option>
          </select>
        </div>
        <div class="field">
          <label>Prioridade</label>
          <select id="f-prio">
            <option value="alta" ${t&&t.prio==='alta'?'selected':''}>Alta</option>
            <option value="media" ${!t||t.prio==='media'?'selected':''}>Média</option>
            <option value="baixa" ${t&&t.prio==='baixa'?'selected':''}>Baixa</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Prazo / data (opcional)</label>
        <input id="f-due" type="date" value="${t&&t.due? t.due:''}" />
      </div>
      <div class="field">
        <label>Notas (opcional)</label>
        <textarea id="f-notes">${t? escapeHtml(t.notes||''):''}</textarea>
      </div>
      <div class="modal-actions">
        ${t? '<button class="btn-delete" id="btn-del">Excluir</button>':''}
        <button class="btn-cancel" id="btn-cancel">Cancelar</button>
        <button class="btn-save" id="btn-save">Salvar</button>
      </div>
    </div>
  `;
  app.appendChild(overlay);

  const areaSel = document.getElementById('f-area');
  function fillSubs(){
    const subs = AREAS[areaSel.value].subs;
    document.getElementById('f-sub').innerHTML = subs.map(s=>`<option ${t&&t.sub===s?'selected':''}>${s}</option>`).join('');
  }
  areaSel.addEventListener('change', fillSubs);
  fillSubs();

  document.getElementById('btn-cancel').onclick = closeModal;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('btn-save').onclick = saveFromModal;
  if(t){ document.getElementById('btn-del').onclick = ()=>{ deleteTask(t.id); closeModal(); }; }
}

function closeModal(){
  const o = document.getElementById('overlay');
  if(o) o.remove();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function saveFromModal(){
  const title = document.getElementById('f-title').value.trim();
  if(!title) return;
  const data = {
    title,
    area: document.getElementById('f-area').value,
    sub: document.getElementById('f-sub').value,
    tipo: document.getElementById('f-tipo').value,
    prio: document.getElementById('f-prio').value,
    due: document.getElementById('f-due').value || null,
    notes: document.getElementById('f-notes').value.trim(),
  };
  if(editingId){
    const idx = tasks.findIndex(x=>x.id===editingId);
    tasks[idx] = {...tasks[idx], ...data};
  } else {
    tasks.push({ id: uid(), status:'afazer', ...data });
  }
  await saveTasks();
  closeModal();
  render();
}

async function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  await saveTasks();
  render();
}

async function cycleStatus(id){
  const order = ['afazer','andamento','feito'];
  const t = tasks.find(x=>x.id===id);
  const idx = order.indexOf(t.status);
  t.status = order[(idx+1)%order.length];
  await saveTasks();
  render();
}

function statusLabel(s){
  return {afazer:'A fazer', andamento:'Em andamento', feito:'Feito'}[s];
}

function tipoLabel(t){
  return {recorrente:'Recorrente', prazo:'Prazo', pontual:'Pontual'}[t];
}

function setFilter(f){
  filterStatus = f;
  render();
}

function setView(v){
  viewMode = v;
  render();
}

function render(){
  const app = document.getElementById('app');
  const filtered = tasks.filter(t=> filterStatus==='todas' ? true : t.status===filterStatus);

  let mainContent;
  if(viewMode === 'prazo'){
    mainContent = renderDeadlineList(filtered);
  } else {
    mainContent = renderBoard(filtered);
  }

  app.innerHTML = `
    <div class="header">
      <h1>Organizador de Tarefas</h1>
      <div class="sub">Mestrado · Movimento Social · Partido · Vida Pessoal · Outros</div>
    </div>
    <div class="toolbar">
      ${['todas','afazer','andamento','feito'].map(f=>`
        <button class="filter-btn ${filterStatus===f?'active':''}" data-filter="${f}">
          ${f==='todas'?'Todas':statusLabel(f)}
        </button>
      `).join('')}
      <div class="view-toggle">
        <button class="filter-btn ${viewMode==='board'?'active':''}" data-view="board">Por área</button>
        <button class="filter-btn ${viewMode==='prazo'?'active':''}" data-view="prazo">Por prazo</button>
      </div>
      <button class="add-btn" id="btn-add">+ Nova tarefa</button>
      <button class="filter-btn" id="btn-export">Exportar (.json)</button>
      <button class="filter-btn" id="btn-import">Importar (.json)</button>
      <button class="filter-btn" id="btn-print">Imprimir / PDF</button>
      <input type="file" id="file-import" accept="application/json" style="display:none;" />
    </div>
    ${mainContent}
  `;

  document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>setFilter(b.dataset.filter));
  });
  document.querySelectorAll('.filter-btn[data-view]').forEach(b=>{
    b.addEventListener('click', ()=>setView(b.dataset.view));
  });
  document.getElementById('btn-add').addEventListener('click', ()=>openModal());
  document.getElementById('btn-export').addEventListener('click', exportTasks);
  document.getElementById('btn-import').addEventListener('click', ()=>document.getElementById('file-import').click());
  document.getElementById('btn-print').addEventListener('click', ()=>window.print());
  document.getElementById('file-import').addEventListener('change', importTasks);
  document.querySelectorAll('.card-title, .dl-title').forEach(el=>{
    el.addEventListener('click', ()=>openModal(el.dataset.id));
  });
  document.querySelectorAll('.js-cycle').forEach(el=>{
    el.addEventListener('click', ()=>cycleStatus(el.dataset.id));
  });
  document.querySelectorAll('.js-edit').forEach(el=>{
    el.addEventListener('click', ()=>openModal(el.dataset.id));
  });
}

function renderBoard(filtered){
  const columns = Object.keys(AREAS).map(areaKey=>{
    const areaTasks = filtered.filter(t=>t.area===areaKey)
      .sort((a,b)=>{
        const prioOrder = {alta:0, media:1, baixa:2};
        const statusOrder = {afazer:0, andamento:1, feito:2};
        return statusOrder[a.status]-statusOrder[b.status] || prioOrder[a.prio]-prioOrder[b.prio];
      });
    const cardsHtml = areaTasks.length ? areaTasks.map(cardHtml).join('') : '<div class="empty">Nenhuma tarefa aqui.</div>';
    const total = tasks.filter(t=>t.area===areaKey).length;
    const done = tasks.filter(t=>t.area===areaKey && t.status==='feito').length;
    return `
      <div class="column col-${areaKey}">
        <div class="column-head">
          <h2>${AREAS[areaKey].label}</h2>
          <div class="count">${done}/${total} concluídas</div>
        </div>
        <div class="cards">${cardsHtml}</div>
      </div>
    `;
  }).join('');
  return `<div class="board">${columns}</div>`;
}

function renderDeadlineList(filtered){
  const withDue = filtered.filter(t=>t.due).sort((a,b)=> a.due.localeCompare(b.due));
  const withoutDue = filtered.filter(t=>!t.due);
  const today = new Date().toISOString().slice(0,10);

  const rows = withDue.map(t=>{
    const overdue = t.due < today && t.status !== 'feito';
    const dateStr = new Date(t.due+'T00:00:00').toLocaleDateString('pt-BR');
    return `
      <div class="deadline-row col-${t.area} ${t.status==='feito'?'done':''} ${overdue?'overdue':''}">
        <div class="dl-date">${dateStr}${overdue?' ⚠':''}</div>
        <span class="dl-area-tag">${AREAS[t.area].label}</span>
        <p class="dl-title" data-id="${t.id}">${escapeHtml(t.title)}</p>
        <span class="tag prio-${t.prio}">${t.prio}</span>
        <span class="dl-sub">${statusLabel(t.status)}</span>
      </div>
    `;
  }).join('');

  const rowsNoDue = withoutDue.map(t=>{
    return `
      <div class="deadline-row col-${t.area} ${t.status==='feito'?'done':''}">
        <div class="dl-date none">sem prazo</div>
        <span class="dl-area-tag">${AREAS[t.area].label}</span>
        <p class="dl-title" data-id="${t.id}">${escapeHtml(t.title)}</p>
        <span class="tag prio-${t.prio}">${t.prio}</span>
        <span class="dl-sub">${statusLabel(t.status)}</span>
      </div>
    `;
  }).join('');

  if(!withDue.length && !withoutDue.length){
    return '<div class="empty">Nenhuma tarefa encontrada.</div>';
  }

  return `
    <div class="deadline-list">
      ${rows || ''}
      ${rowsNoDue ? `<div style="margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase;">Sem prazo definido</div>${rowsNoDue}` : ''}
    </div>
  `;
}

function cardHtml(t){
  const dueStr = t.due ? new Date(t.due+'T00:00:00').toLocaleDateString('pt-BR') : '';
  return `
    <div class="card ${t.status==='feito'?'done':''}">
      ${t.status==='feito' ? '<div class="stamp-mark">Feito</div>' : ''}
      <div class="card-top">
        <p class="card-title" data-id="${t.id}">${escapeHtml(t.title)}</p>
      </div>
      <div class="card-sub">${escapeHtml(t.sub)}</div>
      <div class="card-meta">
        <span class="tag tipo-${t.tipo}">${tipoLabel(t.tipo)}</span>
        <span class="tag prio-${t.prio}">${t.prio}</span>
        ${dueStr? `<span class="due">até ${dueStr}</span>`:''}
      </div>
      ${t.notes? `<div class="due" style="margin-top:6px;">${escapeHtml(t.notes)}</div>`:''}
      <div class="card-actions">
        <button class="js-cycle" data-id="${t.id}">${statusLabel(t.status)} → avançar</button>
        <button class="js-edit" data-id="${t.id}">Editar</button>
      </div>
    </div>
  `;
}

function exportTasks(){
  const blob = new Blob([JSON.stringify(tasks, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tarefas-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importTasks(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('formato inválido');
    // merge, avoiding duplicate ids
    const existingIds = new Set(tasks.map(t=>t.id));
    imported.forEach(t=>{
      if(!t.id || existingIds.has(t.id)) t.id = uid();
      tasks.push(t);
    });
    await saveTasks();
    render();
    alert('Tarefas importadas com sucesso!');
  }catch(err){
    alert('Não consegui ler esse arquivo. Confere se é um .json exportado daqui.');
  }
  e.target.value = '';
}

loadTasks();
</script>
